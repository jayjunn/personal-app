<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="100%" height="100%">
  <!-- Glue Knowledge Hub Logo -->
  <g transform="translate(35, 25)">
    <!-- Connected Dots / Network Icon -->
    <circle cx="20" cy="20" r="10" fill="#000000"/>
    <circle cx="50" cy="50" r="10" fill="#000000"/>
    <circle cx="20" cy="50" r="8" fill="#000000"/>
    <line x1="20" y1="20" x2="50" y2="50" stroke="#000000" stroke-width="4"/>
    <line x1="20" y1="50" x2="50" y2="50" stroke="#000000" stroke-width="4"/>
    
    <!-- Wordmark -->
    <text x="75" y="45" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="36" fill="#000000" letter-spacing="2">GLUE</text>
    <text x="77" y="66" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#555555" letter-spacing="2">KNOWLEDGE HUB</text>
  </g>
</svg>
