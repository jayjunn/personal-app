<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="100%" height="100%">
  <g transform="translate(30, 20)">
    <!-- 3D Cube / Block Mark -->
    <g transform="translate(0, 5)">
      <!-- Top Face -->
      <polygon points="50,15 90,38 50,60 10,38" fill="#1E6BFF"/>
      <!-- Left Face -->
      <polygon points="10,38 50,60 50,105 10,83" fill="#0041CC"/>
      <!-- Right Face -->
      <polygon points="50,60 90,38 90,83 50,105" fill="#0035A6"/>
      <!-- Accent Core -->
      <circle cx="50" cy="60" r="8" fill="#FFFFFF"/>
    </g>

    <!-- Wordmark -->
    <text x="120" y="78" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="56" fill="#000000" letter-spacing="-1">blocko</text>
    <text x="124" y="105" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#0052FF" letter-spacing="3">BLOCKCHAIN SAAS</text>
  </g>
</svg>
